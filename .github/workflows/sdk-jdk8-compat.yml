name: telbank-rbac CI

# 覆盖：
#   - 权限中心后端：JDK 21 单测（53）+ 字节码 major=65
#   - SDK（JDK 8 版）：JDK 17 工具链构建 + 90 单测 + 字节码 major=52
#   - SDK（JDK 21 版）：JDK 21 构建 + 91 单测 + 字节码 major=65 + 示例业务系统构建
#   - 管理前端：Node 22 + `npm ci && npm run build`（tsc 类型检查）
#   - JDK 8 运行时冒烟：在真实 JDK 8 运行时启动示例业务系统并探测 /api/health
#
# 说明：runtime-jdk8 的 JDK 8 只是 CI 测试运行时，不改变交付口径（SDK 产物为 Java 8 字节码，
#       构建工具链 JDK 17；业务系统 JDK 8 + Boot 2.7.x 可直接运行）。

on:
  push:
    branches: [main, master]
    paths:
      - 'telbank-rbac-api/**'
      - 'telbank-rbac-starter/**'
      - 'telbank-rbac-starter-jdk21/**'
      - 'telbank-rbac-front/**'
      - 'samples/**'
      - 'scripts/**'
      - '.github/workflows/sdk-jdk8-compat.yml'
  pull_request:
    paths:
      - 'telbank-rbac-api/**'
      - 'telbank-rbac-starter/**'
      - 'telbank-rbac-starter-jdk21/**'
      - 'telbank-rbac-front/**'
      - 'samples/**'
  workflow_dispatch:

jobs:
  build-api-jdk21:
    name: Build permission center (JDK 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test permission center
        run: mvn -B -pl telbank-rbac-api clean test
      - name: Assert class file major version is 65 (Java 21)
        run: |
          major=$(javap -verbose -cp telbank-rbac-api/target/classes \
            com.telbank.rbac.RbacApiApplication | awk '/major version/{print $3}')
          echo "major=$major"
          test "$major" = "65"

  build-sdk-jdk17:
    name: Build SDK v1 with JDK 17 (Java 8 bytecode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + test SDK
        run: mvn -B -pl telbank-rbac-starter clean test
      - name: Assert class file major version is 52 (Java 8)
        run: |
          major=$(javap -verbose -cp telbank-rbac-starter/target/classes \
            com.telbank.rbac.sdk.RbacSdkAutoConfiguration | awk '/major version/{print $3}')
          echo "major=$major"
          test "$major" = "52"
      - name: Build sample business system (JDK 8 bytecode)
        run: |
          mvn -B -pl telbank-rbac-starter install -DskipTests
          mvn -B -f samples/business-demo/pom.xml -DskipTests package
      - name: Upload sample app for the JDK 8 runtime job
        uses: actions/upload-artifact@v7
        with:
          name: business-demo-jar
          path: samples/business-demo/target/business-demo-1.0.0.jar

  build-sdk-jdk21:
    name: Build SDK v2 (JDK 21 / Boot 4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test JDK 21 SDK
        run: mvn -B -pl telbank-rbac-starter-jdk21 clean test
      - name: Assert class file major version is 65 (Java 21)
        run: |
          major=$(javap -verbose -cp telbank-rbac-starter-jdk21/target/classes \
            com.telbank.rbac.sdk.RbacSdkAutoConfiguration | awk '/major version/{print $3}')
          echo "major=$major"
          test "$major" = "65"
      - name: Build JDK 21 sample business system
        run: |
          mvn -B -pl telbank-rbac-starter-jdk21 install -DskipTests
          mvn -B -f samples/business-demo-jdk21/pom.xml -DskipTests package

  build-front:
    name: Build admin frontend (Node 22)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: telbank-rbac-front
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: telbank-rbac-front/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check + production build
        run: npm run build

  runtime-jdk8:
    name: Smoke-test sample app on JDK 8 runtime
    needs: build-sdk-jdk17
    runs-on: ubuntu-24.04
    steps:
      - name: Download sample app
        uses: actions/download-artifact@v8
        with:
          name: business-demo-jar
      - name: Set up JDK 8 (test runtime only)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Start app on JDK 8 and probe /api/health
        run: |
          java -version
          # 权限中心故意指向不可达地址：SDK 必须降级启动，不能阻塞宿主
          nohup java -jar business-demo-1.0.0.jar \
            --server.port=18081 \
            --rbac-sdk.platform-base-url=http://127.0.0.1:1 \
            > app.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18081/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          cat app.log
          test "$ok" = "1"
          curl -fsS http://localhost:18081/api/health
