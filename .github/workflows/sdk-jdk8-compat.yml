name: SDK JDK 8 compatibility

# 目的：证明「SDK 用 JDK 17 工具链构建、产物是 Java 8 字节码、可在 JDK 8 运行时加载」。
#
# 说明：
# - 交付物构建工具链是 JDK 17（--release 8），产物 class major=52；
# - runtime-jdk8 job 只是「测试运行时」：在 CI 里安装一个 JDK 8 用来冒烟验证，
#   不进入交付物，也不改变本地安装要求（本机业务系统 JDK 8 + Boot 2.7.x 即可直接运行 SDK）。

on:
  push:
    branches: [main, master]
    paths:
      - 'telbank-rbac-starter/**'
      - 'samples/business-demo/**'
      - 'scripts/build-sdk.sh'
      - '.github/workflows/sdk-jdk8-compat.yml'
  pull_request:
    paths:
      - 'telbank-rbac-starter/**'
      - 'samples/business-demo/**'
  workflow_dispatch:

jobs:
  build-sdk-jdk17:
    name: Build SDK with JDK 17 (Java 8 bytecode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + test SDK
        run: mvn -B -pl telbank-rbac-starter clean test

      - name: Assert class file major version is 52 (Java 8)
        run: |
          major=$(javap -verbose -cp telbank-rbac-starter/target/classes \
            com.telbank.rbac.sdk.RbacSdkAutoConfiguration | awk '/major version/{print $3}')
          echo "major=$major"
          test "$major" = "52"

      - name: Build sample business system (JDK 8 bytecode)
        run: |
          mvn -B -pl telbank-rbac-starter install -DskipTests
          mvn -B -f samples/business-demo/pom.xml -DskipTests package

      - name: Upload sample app for the JDK 8 runtime job
        uses: actions/upload-artifact@v4
        with:
          name: business-demo-jar
          path: samples/business-demo/target/business-demo-1.0.0.jar

  runtime-jdk8:
    name: Smoke-test sample app on JDK 8 runtime
    needs: build-sdk-jdk17
    runs-on: ubuntu-latest
    steps:
      - name: Download sample app
        uses: actions/download-artifact@v4
        with:
          name: business-demo-jar

      - name: Set up JDK 8 (test runtime only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Start app on JDK 8 and probe /api/health
        run: |
          java -version
          # 权限中心故意指向不可达地址：SDK 必须降级启动，不能阻塞宿主
          nohup java -jar business-demo-1.0.0.jar \
            --server.port=18081 \
            --rbac-sdk.platform-base-url=http://127.0.0.1:1 \
            > app.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18081/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          cat app.log
          test "$ok" = "1"
          curl -fsS http://localhost:18081/api/health
