# 生产 profile：外部 JWK Set 校验 JWT + Redis 启用；AppSecret/Redis 密码均由环境变量注入
spring:
  data:
    redis:
      host: ${RBAC_REDIS_HOST:127.0.0.1}
      port: ${RBAC_REDIS_PORT:6379}
      password: ${RBAC_REDIS_PASSWORD:}
      timeout: 2s

rbac:
  security:
    jwt:
      mode: jwk
      jwk-set-uri: ${RBAC_JWK_SET_URI}
      issuer: ${RBAC_JWT_ISSUER:}
      hs256-secret: ""
  redis:
    enabled: ${RBAC_REDIS_ENABLED:true}
  cors:
    # 逗号分隔，如 https://rbac.example.com
    allowed-origins: ${RBAC_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
